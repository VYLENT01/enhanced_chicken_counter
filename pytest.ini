[tool:pytest]
# Enhanced Chicken Counter - Pytest Configuration

# Minimum pytest version
minversion = 6.0

# Add source directories to Python path
pythonpath = src

# Test discovery patterns
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Console output formatting
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --color=yes
    --durations=10
    --showlocals
    --disable-warnings

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for system workflows
    performance: Performance and benchmarking tests
    slow: Tests that take more than 5 seconds
    gpu: Tests requiring GPU acceleration
    api: Tests requiring external API access
    video: Tests requiring video processing
    model: Tests requiring ML model loading
    hardware: Tests for specific hardware configurations
    real_data: Tests using real chicken videos/images
    synthetic: Tests using synthetic/generated data
    accuracy: Tests validating counting accuracy
    memory: Tests monitoring memory usage
    fps: Tests measuring frames per second
    tracking: Tests for object tracking functionality
    detection: Tests for object detection functionality
    ai_analysis: Tests for AI behavior analysis
    data_logging: Tests for data storage and retrieval
    cleanup: Tests for system cleanup functionality
    
# Coverage configuration
# (Note: Coverage settings can also be in .coveragerc or pyproject.toml)

# Timeout for long-running tests (in seconds)
timeout = 300

# Ignore specific warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning:torch.*
    ignore::FutureWarning:ultralytics.*
    ignore::RuntimeWarning:numpy.*
    
# Logging configuration for tests
log_auto_indent = true
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# File logging during tests
log_file = tests/test.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Xvfb configuration for headless video testing (Linux)
# xvfb_colordepth = 24
# xvfb_width = 1280
# xvfb_height = 720

# JUnit XML output for CI/CD integration
# junit_family = xunit2

# Test execution options
# Run tests in parallel (requires pytest-xdist)
# addopts = -n auto

# Example usage:
# pytest                          # Run all tests
# pytest -m unit                  # Run only unit tests
# pytest -m "not slow"           # Skip slow tests
# pytest -m "gpu and performance" # Run GPU performance tests
# pytest --cov=src tests/        # Run with coverage
# pytest -k "test_model"         # Run tests matching pattern
# pytest tests/unit/             # Run specific directory
# pytest -x                      # Stop on first failure
# pytest --lf                    # Run last failed tests
# pytest --pdb                   # Drop into debugger on failure